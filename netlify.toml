[build]
  command = "npm run build"
  publish = "dist"
[build.environment]
  NODE_VERSION = "22"
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "DENY"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
[[redirects]]
  from = "https://snackostore.com/*"
  to = "https://snackostore.de/:splat"
  status = 301
  force = true
[[redirects]]
  from = "https://www.snackostore.com/*"
  to = "https://snackostore.de/:splat"
  status = 301
  force = true
[[redirects]]
  from = "https://snackostore.eu/*"
  to = "https://snackostore.de/:splat"
  status = 301
  force = true
[[redirects]]
  from = "https://www.snackostore.eu/*"
  to = "https://snackostore.de/:splat"
  status = 301
  force = true
[[redirects]]
  from = "/standorte"
  to = "/#standort"
  status = 301
[[redirects]]
  from = "/kontakt"
  to = "/#kontakt"
  status = 301
[[redirects]]
  from = "/partner"
  to = "/#standort-anbieten"
  status = 301
[[redirects]]
  from = "/über-uns"
  to = "/"
  status = 301
